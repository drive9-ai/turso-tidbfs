[package]
name = "turso-fs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
turso_core = { version = "=0.8.3", default-features = false, features = ["fs", "uuid", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
